<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Stocks</title>
<style>
  * { box-sizing: border-box; }
  body {
    background: #0d1117;
    color: #e6edf3;
    font-family: system-ui, -apple-system, sans-serif;
    margin: 0;
    padding: 12px;
    min-height: 100vh;
    padding-bottom: 280px;
  }
  h1 {
    text-align: center;
    font-size: 2rem;
    margin: 6px 0 14px;
    font-weight: 600;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 10px;
    max-width: 1400px;
    margin: 0 auto;
  }
  .card {
    background: #161b22;
    border-radius: 12px;
    padding: 14px 10px;
    text-align: center;
    border: 1px solid #30363d;
  }
  .symbol {
    font-size: 1.4rem;
    font-weight: 700;
    margin-bottom: 3px;
  }
  .price {
    font-size: 1.9rem;
    font-weight: 600;
    margin: 4px 0;
  }
  .change {
    font-size: 1.05rem;
    font-weight: 600;
  }
  .up { color: #3fb950; }
  .down { color: #f85149; }
  .updated {
    text-align: center;
    margin-top: 12px;
    color: #8b949e;
    font-size: 0.9rem;
  }

  /* Weather - right */
  .weather {
    position: absolute;
    bottom: 20px;
    right: 20px;
    width: 300px;
    background: #161b22;
    border-radius: 16px;
    padding: 16px;
    border: 1px solid #30363d;
    text-align: center;
    z-index: 10;
  }
  .weather .temp {
    font-size: 2.8rem;
    font-weight: 600;
    margin: 6px 0;
  }
  .weather .desc {
    font-size: 1.2rem;
    margin-bottom: 4px;
  }
  .weather .details {
    font-size: 0.95rem;
    color: #8b949e;
  }

  /* Clock - left */
  .info-panel {
    position: absolute;
    bottom: 20px;
    left: 20px;
    background: #161b22;
    border-radius: 16px;
    padding: 18px 22px;
    border: 1px solid #30363d;
    text-align: center;
    min-width: 240px;
    z-index: 10;
  }
  .clock {
    font-size: 3.2rem;
    font-weight: 600;
    letter-spacing: 1px;
    margin-bottom: 2px;
  }
  .day {
    font-size: 1.35rem;
    font-weight: 500;
    margin-bottom: 2px;
  }
  .date {
    font-size: 1.1rem;
    color: #8b949e;
    margin-bottom: 12px;
  }
  .market-status {
    font-size: 1.1rem;
    font-weight: 600;
    padding: 5px 12px;
    border-radius: 8px;
    display: inline-block;
  }
  .market-open {
    background: #238636;
    color: white;
  }
  .market-closed {
    background: #6e7681;
    color: white;
  }

  /* VIX - center */
  .vix-panel {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #161b22;
    border-radius: 16px;
    padding: 16px 22px;
    border: 1px solid #30363d;
    text-align: center;
    min-width: 340px;
    z-index: 10;
  }
  .vix-title {
    font-size: 1.1rem;
    color: #8b949e;
    margin-bottom: 4px;
  }
  .vix-value {
    font-size: 2.4rem;
    font-weight: 700;
    margin-bottom: 10px;
  }
  .vix-scale {
    position: relative;
    height: 28px;
    border-radius: 8px;
    overflow: hidden;
    display: flex;
    margin-bottom: 6px;
  }
  .vix-zone {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.7rem;
    font-weight: 600;
    color: rgba(255,255,255,0.9);
  }
  .zone-blue   { background: #1f6feb; }
  .zone-green  { background: #238636; }
  .zone-orange { background: #d29922; }
  .zone-red    { background: #da3633; }
  .vix-marker {
    position: absolute;
    top: -6px;
    width: 4px;
    height: 40px;
    background: white;
    border-radius: 2px;
    box-shadow: 0 0 6px rgba(0,0,0,0.6);
    transform: translateX(-50%);
  }
  .vix-labels {
    display: flex;
    justify-content: space-between;
    font-size: 0.7rem;
    color: #8b949e;
  }
</style>
</head>
<body>

<h1>Stocks</h1>
<div class="grid" id="grid"></div>
<div class="updated" id="updated"></div>

<!-- Weather (right) -->
<div class="weather" id="weather">
  <div class="desc" id="wdesc">Loading weather...</div>
  <div class="temp" id="wtemp">--°</div>
  <div class="details" id="wdetails"></div>
</div>

<!-- Clock (left) -->
<div class="info-panel">
  <div class="clock" id="clock">--:--</div>
  <div class="day" id="day">--</div>
  <div class="date" id="date">--</div>
  <div class="market-status" id="market">Checking...</div>
</div>

<!-- VIX (center) -->
<div class="vix-panel" id="vix-panel">
  <div class="vix-title">VIX Volatility</div>
  <div class="vix-value" id="vix-value">--</div>
  <div class="vix-scale">
    <div class="vix-zone zone-blue">Amazing</div>
    <div class="vix-zone zone-green">Calm</div>
    <div class="vix-zone zone-orange">Fear</div>
    <div class="vix-zone zone-red">Extreme</div>
    <div class="vix-marker" id="vix-marker"></div>
  </div>
  <div class="vix-labels">
    <span>&lt;15</span>
    <span>15-20</span>
    <span>20-35</span>
    <span>&gt;35</span>
  </div>
</div>

<script>
const API_KEY = 'dc1c80hr01qgfid73g3gdc1c80hr01qgfid73g40';
const CITY = "Roskilde";

const STOCKS = [
  { symbol: 'TSLA', name: 'Tesla' },
  { symbol: 'PLTR', name: 'Palantir' },
  { symbol: 'NVDA', name: 'NVIDIA' },
  { symbol: 'AMZN', name: 'Amazon' },
  { symbol: 'GOOG', name: 'Google' },
  { symbol: 'AMD', name: 'AMD' },
  { symbol: 'INTC', name: 'Intel' },
  { symbol: 'SPY', name: 'S&P 500' },
  { symbol: 'SPCX', name: 'SpaceX' },
  { symbol: 'ANT', name: 'Anthropic' }
];

async function loadStocks() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  
  for (const stock of STOCKS) {
    try {
      const res = await fetch('https://finnhub.io/api/v1/quote?symbol=' + stock.symbol + '&token=' + API_KEY);
      const data = await res.json();
      
      if (!data.c) continue;
      
      const change = data.d;
      const pct = data.dp;
      const isUp = change >= 0;
      
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = 
        '<div class="symbol">' + stock.name + '</div>' +
        '<div class="price">$' + data.c.toFixed(2) + '</div>' +
        '<div class="change ' + (isUp ? 'up' : 'down') + '">' +
          'Today: ' + (isUp ? '+' : '') + change.toFixed(2) + 
          ' (' + (isUp ? '+' : '') + pct.toFixed(2) + '%)' +
        '</div>';
      grid.appendChild(card);
    } catch (e) {
      console.error(stock.symbol, e);
    }
  }
  
  document.getElementById('updated').textContent = 
    'Last updated: ' + new Date().toLocaleTimeString();
}

async function loadWeather() {
  try {
    const geoRes = await fetch('https://geocoding-api.open-meteo.com/v1/search?name=' + encodeURIComponent(CITY) + '&count=1');
    const geoData = await geoRes.json();
    if (!geoData.results || !geoData.results[0]) {
      document.getElementById('wdesc').textContent = 'Weather unavailable';
      return;
    }
    
    const lat = geoData.results[0].latitude;
    const lon = geoData.results[0].longitude;
    
    const weatherRes = await fetch(
      'https://api.open-meteo.com/v1/forecast?latitude=' + lat + 
      '&longitude=' + lon + 
      '&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m' +
      '&daily=weather_code,temperature_2m_max,temperature_2m_min' +
      '&timezone=auto&forecast_days=4'
    );
    const w = await weatherRes.json();
    const current = w.current;
    const daily = w.daily;
    
    const weatherMap = {
      0:  { icon: "☀️",  desc: "Clear" },
      1:  { icon: "🌤️", desc: "Mainly clear" },
      2:  { icon: "⛅",  desc: "Partly cloudy" },
      3:  { icon: "☁️",  desc: "Overcast" },
      45: { icon: "🌫️", desc: "Fog" },
      48: { icon: "🌫️", desc: "Fog" },
      51: { icon: "🌦️", desc: "Light drizzle" },
      53: { icon: "🌦️", desc: "Drizzle" },
      55: { icon: "🌧️", desc: "Heavy drizzle" },
      61: { icon: "🌧️", desc: "Light rain" },
      63: { icon: "🌧️", desc: "Rain" },
      65: { icon: "🌧️", desc: "Heavy rain" },
      71: { icon: "❄️",  desc: "Light snow" },
      73: { icon: "❄️",  desc: "Snow" },
      75: { icon: "❄️",  desc: "Heavy snow" },
      80: { icon: "🌦️", desc: "Rain showers" },
      81: { icon: "🌧️", desc: "Rain showers" },
      82: { icon: "🌧️", desc: "Heavy showers" },
      95: { icon: "⛈️", desc: "Thunderstorm" }
    };
    
    const info = weatherMap[current.weather_code] || { icon: "🌡️", desc: "Unknown" };
    
    document.getElementById('wtemp').textContent = info.icon + " " + Math.round(current.temperature_2m) + "°";
    document.getElementById('wdesc').textContent = info.desc;
    
    let forecastHTML = '<div style="margin-top:10px; font-size:0.9rem;">';
    const dayNames = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
    
    for (let i = 0; i < 4; i++) {
      const date = new Date(daily.time[i]);
      const weekday = dayNames[date.getDay()];
      const dayLabel = i === 0 ? "Today - " + weekday : weekday;
      const dayIcon = (weatherMap[daily.weather_code[i]] || {icon:"🌡️"}).icon;
      const max = Math.round(daily.temperature_2m_max[i]);
      const min = Math.round(daily.temperature_2m_min[i]);
      
      forecastHTML += 
        '<div style="display:flex; justify-content:space-between; margin:3px 0;">' +
          '<span>' + dayLabel + '</span>' +
          '<span>' + dayIcon + ' ' + max + '° / ' + min + '°</span>' +
        '</div>';
    }
    forecastHTML += '</div>';
    
    document.getElementById('wdetails').innerHTML = 
      'Humidity: ' + current.relative_humidity_2m + '% · Wind: ' + Math.round(current.wind_speed_10m) + ' km/h<br>' +
      CITY + forecastHTML;
  } catch (e) {
    document.getElementById('wdesc').textContent = "Weather unavailable";
  }
}

async function loadVIX() {
async function loadVIX() {
  const titleEl = document.querySelector('.vix-title');
  const valueEl = document.getElementById('vix-value');

  function updateVixMarker(vix) {
    let pos;
    if (vix < 15) {
      pos = (vix / 15) * 25;
    } else if (vix < 20) {
      pos = 25 + ((vix - 15) / 5) * 25;
    } else if (vix < 35) {
      pos = 50 + ((vix - 20) / 15) * 25;
    } else {
      pos = 75 + Math.min(((vix - 35) / 15) * 25, 25);
    }
    pos = Math.max(2, Math.min(98, pos));
    document.getElementById('vix-marker').style.left = pos + '%';
  }

  function showVix(vix, prevClose, sourceName) {
    valueEl.textContent = Number(vix).toFixed(2);
    titleEl.textContent = sourceName;

    // Remove old change line if it exists
    let changeEl = document.getElementById('vix-change');
    if (!changeEl) {
      changeEl = document.createElement('div');
      changeEl.id = 'vix-change';
      changeEl.style.fontSize = '1.05rem';
      changeEl.style.fontWeight = '600';
      changeEl.style.marginTop = '4px';
      valueEl.parentNode.insertBefore(changeEl, valueEl.nextSibling);
    }

    if (prevClose && prevClose > 0) {
      const change = vix - prevClose;
      const pct = (change / prevClose) * 100;
      const isUp = change >= 0;
      changeEl.style.color = isUp ? '#3fb950' : '#f85149';
      changeEl.textContent = 
        'Today: ' + (isUp ? '+' : '') + change.toFixed(2) + 
        ' (' + (isUp ? '+' : '') + pct.toFixed(2) + '%)';
    } else {
      changeEl.textContent = '';
    }

    updateVixMarker(Number(vix));
  }

  // 1. Try Cboe
  try {
    const res = await fetch('https://cdn.cboe.com/api/global/delayed_quotes/quotes/_VIX.json');
    const data = await res.json();
    const vix = data?.data?.current_price || data?.current_price;
    const prev = data?.data?.prev_close || data?.prev_close;
    if (vix) {
      showVix(vix, prev, 'Cboe (VIX Volatility)');
      return;
    }
  } catch (e) {}

  // 2. Try Yahoo via CORS proxy
  try {
    const res = await fetch('https://proxy.cors.dev/https://query1.finance.yahoo.com/v8/finance/chart/%5EVIX?interval=1d&range=5d');
    const data = await res.json();
    const meta = data?.chart?.result?.[0]?.meta;
    const vix = meta?.regularMarketPrice;
    const prev = meta?.chartPreviousClose || meta?.previousClose;
    if (vix) {
      showVix(vix, prev, 'Yahoo (VIX Volatility)');
      return;
    }
  } catch (e) {}

  // 3. Fallback to Finnhub VIXY
  try {
    const res = await fetch('https://finnhub.io/api/v1/quote?symbol=VIXY&token=' + API_KEY);
    const data = await res.json();
    if (data.c) {
      showVix(data.c, data.pc, 'Finnhub VIXY (Proxy)');
      return;
    }
  } catch (e) {}

  valueEl.textContent = 'N/A';
  titleEl.textContent = 'VIX (Unavailable)';
  const changeEl = document.getElementById('vix-change');
  if (changeEl) changeEl.textContent = '';
       }

function updateVixMarker(vix) {
  // Zones: Blue <15 | Green 15-20 | Orange 20-35 | Red >35
  let pos;
  if (vix < 15) {
    pos = (vix / 15) * 25;
  } else if (vix < 20) {
    pos = 25 + ((vix - 15) / 5) * 25;
  } else if (vix < 35) {
    pos = 50 + ((vix - 20) / 15) * 25;
  } else {
    pos = 75 + Math.min(((vix - 35) / 15) * 25, 25);
  }
  
  pos = Math.max(2, Math.min(98, pos));
  document.getElementById('vix-marker').style.left = pos + '%';
}

function updateClock() {
  const now = new Date();
  
  const hours = String(now.getHours()).padStart(2, '0');
  const minutes = String(now.getMinutes()).padStart(2, '0');
  document.getElementById('clock').textContent = hours + ':' + minutes;
  
  const dayNames = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  document.getElementById('day').textContent = dayNames[now.getDay()];
  
  const months = ["January", "February", "March", "April", "May", "June", 
                  "July", "August", "September", "October", "November", "December"];
  document.getElementById('date').textContent = 
    now.getDate() + ' ' + months[now.getMonth()] + ' ' + now.getFullYear();
}

function updateMarketStatus() {
  const now = new Date();
  const nyTime = new Date(now.toLocaleString('en-US', { timeZone: 'America/New_York' }));
  const day = nyTime.getDay();
  const hours = nyTime.getHours();
  const minutes = nyTime.getMinutes();
  const timeInMinutes = hours * 60 + minutes;

  const isWeekday = day >= 1 && day <= 5;
  const isOpen = isWeekday && timeInMinutes >= 570 && timeInMinutes < 960;

  const statusEl = document.getElementById('market');
  if (isOpen) {
    statusEl.textContent = 'Market Open';
    statusEl.className = 'market-status market-open';
  } else {
    statusEl.textContent = 'Market Closed';
    statusEl.className = 'market-status market-closed';
  }
}

loadStocks();
loadWeather();
loadVIX();
updateClock();
updateMarketStatus();

setInterval(loadStocks, 45000);
setInterval(loadWeather, 600000);
setInterval(loadVIX, 60000);
setInterval(updateClock, 1000);
setInterval(updateMarketStatus, 60000);
</script>
</body>
</html>
