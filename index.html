<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Stocks</title>
<style>
  * { box-sizing: border-box; }
  body {
    background: #0d1117;
    color: #e6edf3;
    font-family: system-ui, -apple-system, sans-serif;
    margin: 0;
    padding: 12px;
    min-height: 100vh;
  }
  h1 {
    text-align: center;
    font-size: 2.2rem;
    margin: 8px 0 16px;
    font-weight: 600;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 12px;
    max-width: 1400px;
    margin: 0 auto;
  }
  .card {
    background: #161b22;
    border-radius: 12px;
    padding: 16px 12px;
    text-align: center;
    border: 1px solid #30363d;
  }
  .symbol {
    font-size: 1.6rem;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .price {
    font-size: 2.1rem;
    font-weight: 600;
    margin: 6px 0;
  }
  .change {
    font-size: 1.15rem;
    font-weight: 600;
  }
  .up { color: #3fb950; }
  .down { color: #f85149; }
  .updated {
    text-align: center;
    margin-top: 16px;
    color: #8b949e;
    font-size: 0.95rem;
  }

  .weather {
    position: absolute;
    bottom: 30px;
    right: 30px;
    width: 320px;
    background: #161b22;
    border-radius: 16px;
    padding: 20px;
    border: 1px solid #30363d;
    text-align: center;
  }
  .weather .temp {
    font-size: 3.2rem;
    font-weight: 600;
    margin: 8px 0;
  }
  .weather .desc {
    font-size: 1.3rem;
    margin-bottom: 6px;
  }
  .weather .details {
    font-size: 1rem;
    color: #8b949e;
  }
</style>
</head>
<body>

<h1>My Stocks</h1>
<div class="grid" id="grid"></div>
<div class="updated" id="updated"></div>

<div class="weather" id="weather">
  <div class="desc" id="wdesc">Loading weather...</div>
  <div class="temp" id="wtemp">--°</div>
  <div class="details" id="wdetails"></div>
</div>

<script>
const API_KEY = 'dc1c80hr01qgfid73g3gdc1c80hr01qgfid73g40';
const CITY = "Roskilde";

const STOCKS = [
  { symbol: 'TSLA', name: 'Tesla' },
  { symbol: 'PLTR', name: 'Palantir' },
  { symbol: 'NVDA', name: 'NVIDIA' },
  { symbol: 'AMZN', name: 'Amazon' },
  { symbol: 'GOOG', name: 'Alphabet' },
  { symbol: 'AMD', name: 'AMD' },
  { symbol: 'INTC', name: 'Intel' },
  { symbol: 'SPY', name: 'S&P 500' }
];

async function loadStocks() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  
  for (const stock of STOCKS) {
    try {
      const res = await fetch(`https://finnhub.io/api/v1/quote?symbol=${stock.symbol}&token=${API_KEY}`);
      const data = await res.json();
      
      if (!data.c) continue;
      
      const change = data.d;
      const pct = data.dp;
      const isUp = change >= 0;
      
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="symbol">${stock.name}</div>
        <div class="price">$${data.c.toFixed(2)}</div>
        <div class="change ${isUp ? 'up' : 'down'}">
          ${isUp ? '+' : ''}${change.toFixed(2)} (${isUp ? '+' : ''}${pct.toFixed(2)}%)
        </div>
      `;
      grid.appendChild(card);
    } catch (e) {
      console.error(stock.symbol, e);
    }
  }
  
  document.getElementById('updated').textContent = 
    'Last updated: ' + new Date().toLocaleTimeString();
}

async function loadWeather() {
  try {
    const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(CITY)}&count=1`);
    const geoData = await geoRes.json();
    if (!geoData.results || !geoData.results[0]) return;
    
    const { latitude, longitude } = geoData.results[0];
    
    const weatherRes = await fetch(
      `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=4`
    );
    const w = await weatherRes.json();
    const current = w.current;
    const daily = w.daily;
    
    const weatherMap = {
      0:  { icon: "☀️",  desc: "Clear" },
      1:  { icon: "🌤️", desc: "Mainly clear" },
      2:  { icon: "⛅",  desc: "Partly cloudy" },
      3:  { icon: "☁️",  desc: "Overcast" },
      45: { icon: "🌫️", desc: "Fog" },
      48: { icon: "🌫️", desc: "Fog" },
      51: { icon: "🌦️", desc: "Light drizzle" },
      53: { icon: "🌦️", desc: "Drizzle" },
      55: { icon: "🌧️", desc: "Heavy drizzle" },
      61: { icon: "🌧️", desc: "Light rain" },
      63: { icon: "🌧️", desc: "Rain" },
      65: { icon: "🌧️", desc: "Heavy rain" },
      71: { icon: "❄️",  desc: "Light snow" },
      73: { icon: "❄️",  desc: "Snow" },
      75: { icon: "❄️",  desc: "Heavy snow" },
      80: { icon: "🌦️", desc: "Rain showers" },
      81: { icon: "🌧️", desc: "Rain showers" },
      82: { icon: "🌧️", desc: "Heavy showers" },
      95: { icon: "⛈️", desc: "Thunderstorm" }
    };
    
    const info = weatherMap[current.weather_code] || { icon: "🌡️", desc: "Unknown" };
    
    document.getElementById('wtemp').textContent = info.icon + " " + Math.round(current.temperature_2m) + "°";
    document.getElementById('wdesc').textContent = info.desc;
    
    // Build forecast with real weekday names
    let forecastHTML = `<div style="margin-top:12px; font-size:0.95rem;">`;
    const dayNames = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
    
    for (let i = 0; i < 4; i++) {
      const date = new Date(daily.time[i]);
      const dayLabel = i === 0 ? "Today" : dayNames[date.getDay()];
      const dayIcon = weatherMap[daily.weather_code[i]]?.icon || "🌡️";
      const max = Math.round(daily.temperature_2m_max[i]);
      const min = Math.round(daily.temperature_2m_min[i]);
      
      forecastHTML += `
        <div style="display:flex; justify-content:space-between; margin:4px 0;">
          <span>${dayLabel}</span>
          <span>${dayIcon} ${max}° / ${min}°</span>
        </div>
      `;
    }
    forecastHTML += `</div>`;
    
    document.getElementById('wdetails').innerHTML = 
      `Humidity: ${current.relative_humidity_2m}% · Wind: ${Math.round(current.wind_speed_10m)} km/h<br>
       ${CITY}${forecastHTML}`;
  } catch (e) {
    document.getElementById('wdesc').textContent = "Weather unavailable";
  }
}

loadStocks();
loadWeather();
setInterval(loadStocks, 45000);
setInterval(loadWeather, 600000);
</script>
</body>
</html>
